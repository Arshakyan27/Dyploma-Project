[project]
name = "techdoc-integrity"
version = "0.1.0"
description = "Integrity and authenticity control for technical documents (Blockchain registry + RAG, backend core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "pypdf>=5.0",
    "reportlab>=4.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "basedpyright"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.basedpyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
